
name: Customer Churn ML CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Code
        run: |
          python -m compileall -q api.py tests

      - name: Run Automated Tests
        run: |
          python -m pytest tests -v

      - name: Build Application
        run: |
          python -c "from api import app; print('FastAPI application loaded successfully')"

      - name: CI Pipeline Completed
        run: echo "All validation, tests and application build checks passed."
